- model_inputs:
    model_type: Early_Siamese_RetFound # Teresa
    image_size: 224
    num_classes: 3
    channels: 1
    imgnet_pretrained: false
    loss: focal
    late_fusion: false
    attention: false

- dataset: 
    dataset_name: MARIO
    csv_train: MARIO/Data/Task_1/task_1_with_path_train.csv
    csv_val: MARIO/Data/Task_1/task_1_with_path_val.csv
    csv_test: MARIO/Data/Task_1/task_1_with_path_test.csv
    mario_base_path: MARIO/Data/Task_1
    shuffle: true
    num_workers: 20



- train_config:
      train: true
      pretrain: true
      resume: false
      allow_size_mismatch: true
      num_epochs: 50
      batch_size: 54
      load_path:  pretrained-weights/Retfound
      checkpoint: RETFound_oct_weights.pth
      use_gpu: true
      init_lr: 0.0001
      optimizer: adamw
      scheduler: cosine_with_warmup
      step_coeff: 8
      momentum: 0.9
      weight_decay: 0.05
      warmup_epochs: 10
      T_mult: 1
      eta_min: 0
      last_epoch: -1
      lr_cent: 0.005
- log:
    save_path: DiseaseProgression/MARIO_Paper_baselines/log
- where : ./


