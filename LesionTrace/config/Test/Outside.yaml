- model_inputs:
    back_bone: vit_base_patch16_224
    channels: 3
    embed_dim: 768
    image_size: 224
    imgnet_pretrained: false
    imgnet_pretrained_weights: ./
    loss: focal
    model_type: modelsOnlyOutsideandDelta
    ablation_type: null     # final model (A2, DeltaSpatialHead)
    num_classes: 3
    patch_size: 16
    save_metric: f1
    top_k: 5
- dataset:
    csv_test: MARIO/Data/Task_1/task_1_with_path_test.csv
    csv_train: MARIO/Data/Task_1/task_1_with_path_train.csv
    csv_val: MARIO/Data/Task_1/task_1_with_path_val.csv
    dataset_name: MARIO
    mario_base_path: MARIO/Data/Task_1
    num_workers: 5
    proto_path: Marzieh/DiseaseProgression/PiPViTCNV/log/Masks_Mario/
    shuffle: true
    test_with_val_set: false
    visualize: false
- train_config:
    DirectionalAngleLoss: true
    DirectionalAngleLosscoeff: 0.3
    GradCAM: false
    T_mult: 1
    allow_size_mismatch: true
    aux_map_coef: 0.0
    balance: false
    batch_size: 1
    load_path: Marzieh/DiseaseProgression/SynthChange/log/MARIO/Final_Results/Ablation50/withsupervision/Outside-withsupervision/modelsOnlyOutsideandDelta_224_MARIO/20260519-082211
    checkpoint: current_val_f1_0.8033_ckpt.pth.tar
    cls_loss_coef: 1.0
    cls_token: null
    drop_path_rate: 0.1
    eta_min: 1.0e-07
    init_lr: 1.0e-06
    label_smoothing: 0.1
    lambda_mse: 0.3
    lambda_wasser_stein: 0.0
    last_epoch: -1
    linear_probing: false
    loss: focal
    max_lr: 5.0e-06
    mixups_alpha: 0.0
    model_type: LesionChangeDetector
    momentum: 0.9
    num_epochs: 50
    optimizer: adamw
    pretrain: true
    rand_aug: true
    resume: false
    save_metric: f1
    scheduler: cosine_annealing
    siamese: false
    step_coeff: 8
    train: false
    use_ema: false
    use_gpu: true
    use_map_loss: true
    warmup_epochs: 5
    wasser_stein: false
    weight_decay: 0.2
- log:
    save_path: DiseaseProgression/SynthChange/log/MARIO/Final_Results/Ablation50
- where: ./